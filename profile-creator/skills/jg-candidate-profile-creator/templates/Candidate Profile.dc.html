:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;$—/hr&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Header&quot;},&quot;submittedFor&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Senior Backend Engineer&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Footer&quot;}}">

    const p = this.props;

    return {

      showStack: p.showStack !== false,
      skillStyle: p.skillStyle || 'tags',
      tagShape: p.tagShape || 'pill',

      showRate: p.showRate === true,

}
